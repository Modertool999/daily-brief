name: Daily AI Brief

on:
  schedule:
    # Start early to absorb scheduler delays; send as soon as research is ready.
    - cron: '7 4 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = Telegram only, preview = research only, send = research + Telegram'
        type: choice
        options: [test, preview, send]
        default: test
permissions:
  contents: read

concurrency:
  group: daily-ai-brief
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    # Research has a 40-minute request timeout; allow setup and delivery too.
    timeout-minutes: 60
    env:
      MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install openai
      - name: Research and/or deliver
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          DAILY_BRIEF_PROMPT: ${{ secrets.DAILY_BRIEF_PROMPT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_brief.py "$MODE"
