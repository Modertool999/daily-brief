name: Daily AI Brief

on:
  schedule:
    - cron: '30 10 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = Telegram only, preview = research only, send = research + Telegram'
        type: choice
        options: [test, preview, send]
        default: test

permissions:
  contents: read

concurrency:
  group: daily-ai-brief
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openai
      - name: Research and/or deliver
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}
        run: python daily_brief.py "$MODE"
