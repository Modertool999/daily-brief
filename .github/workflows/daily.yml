name: Daily AI Brief

on:
  schedule:
    # Backup retries; cron-job.org triggers the primary run at 10 AM Eastern.
    - cron: '7 11-12 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = Telegram only, preview = research only, send = research + Telegram'
        type: choice
        options: [test, preview, send]
        default: test
      wait_until_delivery:
        description: 'Wait until 11 AM Eastern before sending (enable for external scheduler)'
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: daily-ai-brief
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    # Allows research plus a wait from the primary 10 AM trigger to 11 AM.
    timeout-minutes: 120
    env:
      MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Determine delivery date
        id: date
        run: echo "day=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
      - name: Check today's delivery record
        id: delivered
        if: env.MODE == 'send'
        uses: actions/cache/restore@v4
        with:
          path: .delivery
          key: daily-brief-delivered-v1-${{ steps.date.outputs.day }}
      - name: Skip an already delivered briefing
        if: env.MODE == 'send' && steps.delivered.outputs.cache-hit == 'true'
        run: echo "Today's briefing has already been delivered."
      - name: Set up Python
        if: steps.delivered.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        if: steps.delivered.outputs.cache-hit != 'true'
        run: python -m pip install openai
      - name: Research and/or deliver
        if: steps.delivered.outputs.cache-hit != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          DAILY_BRIEF_PROMPT: ${{ secrets.DAILY_BRIEF_PROMPT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          args=("$MODE")
          if [[ '${{ github.event_name }}' == 'schedule' || '${{ inputs.wait_until_delivery }}' == 'true' ]]; then
            args+=(--wait-until-delivery)
          fi
          python daily_brief.py "${args[@]}"
      - name: Record successful delivery
        if: env.MODE == 'send' && steps.delivered.outputs.cache-hit != 'true'
        run: |
          mkdir -p .delivery
          echo '${{ steps.date.outputs.day }}' > .delivery/sent
      - name: Save delivery record for later retries
        if: env.MODE == 'send' && steps.delivered.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .delivery
          key: daily-brief-delivered-v1-${{ steps.date.outputs.day }}
